name: One-time NoutyChess finalization

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-p0.mjs
      - scripts/finalize-gameplay.mjs

concurrency:
  group: noutychess-finalization
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply final source fixes
        run: |
          node scripts/finalize-p0.mjs
          node scripts/finalize-gameplay.mjs

      - name: Install compatible security releases
        run: |
          npm pkg set dependencies.react=19.2.8
          npm pkg set dependencies.react-dom=19.2.8
          npm pkg set dependencies.react-server-dom-webpack=19.2.8
          npm pkg set dependencies.vinext=1.0.0-beta.9
          npm pkg set devDependencies.vite=8.2.2
          npm pkg set devDependencies.@vitejs/plugin-rsc=0.5.34
          npm pkg set overrides.undici='^7.29.0'
          npm install

      - name: Service worker syntax
        run: node --check public/sw.js

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Block High or Critical production vulnerabilities
        run: timeout 240s npm audit --omit=dev --audit-level=high

      - name: Commit validated finalization
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "Ekasy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finaliza segurança, domínio e multiplayer do NoutyChess"
          git push
