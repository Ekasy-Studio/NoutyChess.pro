name: One-time invite notification sound

on:
  push:
    branches: [main]
    paths:
      - scripts/integrate-invite-notification-sound.mjs
      - .github/workflows/one-time-invite-notification-sound.yml

concurrency:
  group: noutychess-invite-notification-sound
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply invite notification sound
        run: node scripts/integrate-invite-notification-sound.mjs

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated invite sound
        run: |
          git config user.name "Ekasy automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/nouty-chess-game.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Toca som somente para novos convites de partida"
          git push
