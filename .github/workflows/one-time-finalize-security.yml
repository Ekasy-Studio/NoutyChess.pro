name: One-time NoutyChess security finalization

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-security.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply security finalization
        run: node scripts/finalize-security.mjs

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "Ekasy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reforça segurança das mutações administrativas"
          git push
