name: One-time mobile game flow

on:
  push:
    branches: [main]
    paths:
      - scripts/mobile-game-flow.mjs
      - .github/workflows/one-time-mobile-game-flow.yml

concurrency:
  group: noutychess-mobile-game-flow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply mobile flow
        run: node scripts/mobile-game-flow.mjs

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated mobile flow
        run: |
          git config user.name "Ekasy automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/nouty-chess-game.tsx app/enhancements.css
          git diff --cached --quiet && exit 0
          git commit -m "Melhora fluxo mobile de menu e sala online"
          git push
