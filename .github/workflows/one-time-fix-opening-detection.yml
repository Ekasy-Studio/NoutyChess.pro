name: One-time opening detection fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-opening-detection.mjs

concurrency:
  group: noutychess-opening-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply opening detection fix
        run: node scripts/fix-opening-detection.mjs

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated fix
        run: |
          git config user.name "Ekasy automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/chess-knowledge.ts
          git diff --cached --quiet && exit 0
          git commit -m "Corrige detecção prematura de aberturas"
          git push
