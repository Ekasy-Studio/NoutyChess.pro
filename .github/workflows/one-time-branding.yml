name: One-time NoutyChess branding patch

on:
  push:
    branches: [main]
    paths:
      - scripts/one-time-branding.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact branding replacements
        run: node scripts/one-time-branding.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- components/nouty-chess-game.tsx; then
            echo "No branding changes needed."
            exit 0
          fi
          git config user.name "Ekasy automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/nouty-chess-game.tsx
          git commit -m "Atualiza branding e compartilhamento no jogo"
          git push
