name: One-time prepare PWA assets

on:
  push:
    branches: [main]
    paths:
      - scripts/prepare-pwa-assets.mjs
      - .github/workflows/one-time-prepare-pwa-assets.yml

concurrency:
  group: noutychess-pwa-assets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install temporary SVG renderer
        run: npm install --no-save --package-lock=false @resvg/resvg-js@2.6.2

      - name: Render mobile icons
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { Resvg } from '@resvg/resvg-js';

          const source = fs.readFileSync('public/icon.svg', 'utf8');
          for (const [size, output] of [
            [192, 'public/icon-192.png'],
            [512, 'public/icon-512.png'],
            [180, 'public/apple-touch-icon.png'],
          ]) {
            const renderer = new Resvg(source, {
              fitTo: { mode: 'width', value: size },
              font: { loadSystemFonts: true },
            });
            const png = renderer.render().asPng();
            fs.writeFileSync(output, png);
            if (png.length < 1000) throw new Error(`PNG ${output} parece inválido.`);
          }
          EOF
          file public/icon-192.png public/icon-512.png public/apple-touch-icon.png

      - name: Update PWA metadata
        run: node scripts/prepare-pwa-assets.mjs

      - name: Restore locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated PWA assets
        run: |
          git config user.name "Ekasy automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png public/apple-touch-icon.png public/manifest.webmanifest app/layout.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Melhora instalação PWA em Android e iOS"
          git push
